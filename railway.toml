# Railway Config as Code (читается автоматически при деплое).
# Локально не используется — .env и SQLite не меняются.

[build]
builder = "nixpacks"
# Зависимости — в nixpacks.toml [phases.install]; отдельный buildCommand дублировал composer install.

[deploy]
preDeployCommand = "/bin/sh ./scripts/railway-predeploy.sh"
startCommand = "/bin/sh ./scripts/railway-start.sh"
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
