# Сборка PHP на Railway (расширения для PostgreSQL и картинок).
# Локальный .env не используется.

[phases.setup]
# При переопределении nixPkgs нужно явно указать composer (иначе install/build падают с exit 127).
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "php83Extensions.pdo_pgsql",
  "php83Extensions.gd",
  "php83Extensions.mbstring",
  "php83Extensions.openssl",
  "php83Extensions.curl",
  "php83Extensions.zip",
  "php83Extensions.fileinfo",
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]
