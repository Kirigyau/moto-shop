# Сборка PHP на Railway (расширения для PostgreSQL и картинок).
# Локальный .env не используется.

[phases.setup]
# При переопределении nixPkgs нужно явно указать composer (иначе install/build падают с exit 127).
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "php84Extensions.pdo_pgsql",
  "php84Extensions.gd",
  "php84Extensions.mbstring",
  "php84Extensions.openssl",
  "php84Extensions.curl",
  "php84Extensions.zip",
  "php84Extensions.fileinfo",
]

[phases.install]
cmds = [
  "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction",
]
