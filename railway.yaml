# Справочник конфигурации деплоя (YAML).
# Railway применяет файлы railway.toml или railway.json из корня репозитория.
# Этот YAML для удобства чтения; при расхождении ориентируйтесь на railway.toml.
#
# Переменные окружения — только в панели Railway (см. railway.env.example).

build:
  builder: NIXPACKS
  # composer install — в nixpacks.toml [phases.install]

deploy:
  preDeployCommand: /bin/sh ./scripts/railway-predeploy.sh
  startCommand: /bin/sh ./scripts/railway-start.sh
  healthcheckPath: /up
  healthcheckTimeout: 120
  restartPolicyType: on_failure
  restartPolicyMaxRetries: 3

# preDeploy выполняет (scripts/railway-predeploy.sh):
#   1. php artisan migrate --force
#   2. php artisan db:seed --class=DeploySeeder --force
#   3. php artisan storage:link
